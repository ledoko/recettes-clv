<script>
// ===================================================================== calcul des coûts (commun serveur + page)
// Ingrédient : { id, nom, prix (HT pour un conditionnement), cond (qté du conditionnement), unite: 'g'|'ml'|'pièce', rend }
// Recette    : { id, nom, ingredient (bool : utilisable dans d'autres recettes, au coût HT par gramme),
//                portions, portionsAuto (bool : portions = poids net ÷ poidsPortion), poidsPortion, prixTTC, tgc, cible,
//                poidsFinal, lignes: [{ t: 'i'|'r', id, qte, rend }] }
// Rendement : poids utilisable ÷ poids acheté (0,6 = 60 %). Quantité brute = quantité nette ÷ rendement.

function prixUnite(ing) {
  if (!ing || ing.prix === null || ing.prix === undefined || ing.prix === '' || !ing.cond) return null;
  return Number(ing.prix) / Number(ing.cond);
}

function calculerTout(ingredients, recettes, surcharge) {
  surcharge = surcharge || {};
  const ING = {}; for (const i of ingredients) ING[i.id] = i;
  const REC = {}; for (const r of recettes) REC[r.id] = r;
  const prixPrepa = {};   // id recette -> coût HT par gramme
  let res = {};
  for (let tour = 0; tour < 12; tour++) {
    let change = false;
    res = {};
    for (const r of recettes) {
      let total = 0, net = 0; const manquants = [], lignes = [];
      for (const l of (r.lignes || [])) {
        let nom = '?', unite = '', pu = null, rendBase = 1;
        if (l.t === 'r') {
          const sr = REC[l.id];
          if (sr) { nom = sr.nom; unite = 'g'; pu = (sr.ingredient && sr.id !== r.id) ? (prixPrepa[sr.id] ?? null) : null; }
        } else {
          const ing = ING[l.id];
          if (ing) { nom = ing.nom; unite = ing.unite; pu = (l.id in surcharge) ? surcharge[l.id] : prixUnite(ing); rendBase = Number(ing.rend) || 1; }
        }
        const q = (l.qte === null || l.qte === undefined || l.qte === '') ? null : Number(l.qte);
        const rend = Number(l.rend) || rendBase || 1;
        let brut = null, cout = null;
        if (q !== null && !isNaN(q)) {
          net += q; brut = q / rend;
          if (pu !== null) { cout = brut * pu; total += cout; }
        }
        if (pu === null || q === null) manquants.push(nom + (q === null ? ' (quantité)' : ''));
        lignes.push({ nom: nom, unite: unite, pu: pu, rendBase: rendBase, rend: rend, qte: q, brut: brut, cout: cout, t: l.t, id: l.id });
      }
      const poids = Number(r.poidsFinal) || net;
      const cg = poids ? total / poids : null;
      let portions = Number(r.portions) || 1;
      if (r.portionsAuto && Number(r.poidsPortion)) portions = Math.max(1, Math.floor(net / Number(r.poidsPortion)));
      const tgc = (r.tgc === null || r.tgc === undefined || r.tgc === '') ? 0.06 : Number(r.tgc);
      const cible = Number(r.cible) || 0.3;
      const cp = total / portions;
      const ht = Number(r.prixTTC) ? Number(r.prixTTC) / (1 + tgc) : null;
      const fc = ht ? cp / ht : null;
      res[r.id] = { total: total, net: net, poids: poids, cg: cg, portions: portions, cp: cp, ht: ht, fc: fc, cible: cible,
                    marge: ht ? ht - cp : null, coef: (ht && cp) ? ht / cp : null, conseil: cp / cible * (1 + tgc),
                    manquants: manquants, lignes: lignes };
      if (r.ingredient && cg !== null) {
        if (prixPrepa[r.id] === undefined || Math.abs(prixPrepa[r.id] - cg) > 1e-9) { prixPrepa[r.id] = cg; change = true; }
      }
    }
    if (!change) break;
  }
  return { res: res, prixPrepa: prixPrepa };
}

// recettes qui utilisent un ingrédient (directement ou à travers une sauce maison)
function recettesUtilisant(recettes, t, id) {
  const out = new Set(); let cibles = [[t, id]];
  for (let n = 0; n < 12 && cibles.length; n++) {
    const suiv = [];
    for (const r of recettes) {
      if (out.has(r.id)) continue;
      if ((r.lignes || []).some(l => cibles.some(c => c[0] === l.t && c[1] === l.id))) { out.add(r.id); if (r.ingredient) suiv.push(['r', r.id]); }
    }
    cibles = suiv;
  }
  return [...out];
}

const APP_VERSION = "1.0";
const API = window.API_URL || 'http://localhost:8787/';
let TOKEN = localStorage.getItem('rclv_token') || '';
let D = null, C = null, PREPA = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (x, d = 0) => (x === null || x === undefined || isNaN(x)) ? '–' : Number(x).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const F = x => (x === null || x === undefined || isNaN(x)) ? '–' : nf(x) + ' F';
const P = (x, d = 0) => (x === null || x === undefined || isNaN(x)) ? '–' : nf(x * 100, d) + ' %';
const norm = s => String(s || '').replace(/œ/g, 'oe').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }

async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, token: TOKEN, data }) });
  const j = await r.json();
  if (!j.ok) { if (j.erreur === 'SESSION') { TOKEN = ''; localStorage.removeItem('rclv_token'); rendre(); throw new Error('Session expirée'); } throw new Error(j.erreur); }
  return j.r;
}
async function charger() {
  D = await api('etat');
  try { localStorage.setItem('rclv_cache', JSON.stringify(D)); } catch (e) {}
  recalculer();
}
function recalculer() { const x = calculerTout(D.ingredients, D.recettes); C = x.res; PREPA = x.prixPrepa; }
const ING = id => D.ingredients.find(i => i.id === id);
const REC = id => D.recettes.find(r => r.id === id);
function uniteLabel(i) { return i.unite === 'pièce' ? 'pièce' : (i.unite === 'ml' ? 'L' : 'kg'); }
function prixAff(i) { const pu = prixUnite(i); if (pu === null) return null; return i.unite === 'pièce' ? pu : pu * 1000; }
function fcPill(fc, cible) { if (fc === null || fc === undefined) return '<span class="pill p-g">non vendu</span>'; const c = fc > cible ? 'p-ko' : (fc > cible - 0.03 ? 'p-warn' : 'p-ok'); return `<span class="pill ${c}">${P(fc, 1)}</span>`; }
function varPill(v) { if (v === null || v === undefined) return ''; if (Math.abs(v) < 0.005) return '<span class="pill p-g">=</span>'; return `<span class="pill ${v > 0 ? 'p-ko' : 'p-ok'}">${v > 0 ? '+' : '−'}${nf(Math.abs(v) * 100, 0)} %</span>`; }
const vendues = () => D.recettes.filter(r => Number(r.prixTTC));
const versionsDe = r => r && r.famille ? D.recettes.filter(o => o.famille && norm(o.famille) === norm(r.famille)).sort((a, b) => (a.version || a.nom).localeCompare(b.version || b.nom, 'fr', { numeric: true })) : [];
// tailles : la recette telle que saisie = taille de base (coef 1) ; chaque autre taille multiplie toutes les quantités
// volume (ml) ou poids (g) d'une portion de base : « poids d'une portion » s'il est saisi, sinon total ÷ portions
const volPortion = (r, c) => Number(r.poidsPortion) || (c && c.portions ? c.poids / c.portions : null);
const coefTaille = (t, v0) => Number(t.volume) && v0 ? Number(t.volume) / v0 : (Number(t.coef) || 1);
const taillesDe = r => r ? [{ nom: r.tailleBase || 'Normal', coef: 1, volume: volPortion(r, C[r.id]), prixTTC: r.prixTTC ?? null, base: true }, ...(r.tailles || [])] : [];
function calcTaille(r, nomT) {
  const c = C[r.id]; if (!c) return { c, t: null };
  const T = taillesDe(r), t = T.find(x => x.nom === nomT) || T[0], v0 = volPortion(r, c), k = t.base ? 1 : coefTaille(t, v0);
  const tgc = (r.tgc === null || r.tgc === undefined || r.tgc === '') ? 0.06 : Number(r.tgc), ht = Number(t.prixTTC) ? Number(t.prixTTC) / (1 + tgc) : null, cp = c.cp * k;
  return { t, c: Object.assign({}, c, { total: c.total * k, net: c.net * k, poids: c.poids * k, cp, ht, fc: ht ? cp / ht : null, marge: ht ? ht - cp : null,
    coef: ht && cp ? ht / cp : null, conseil: cp / c.cible * (1 + tgc), vol: v0 ? v0 * k : null, k, lignes: c.lignes.map(l => Object.assign({}, l, { qte: l.qte === null ? null : l.qte * k, brut: l.brut === null ? null : l.brut * k, cout: l.cout === null ? null : l.cout * k })) }) };
}
function choisirTaille(id, k) { ETAT.taille = ETAT.taille || {}; ETAT.taille[id] = taillesDe(REC(id))[k].nom; rendre(); }
const familles = () => [...new Set(D.recettes.map(r => r.famille).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
const dossiers = () => [...new Set(D.recettes.map(r => r.dossier || 'Sans dossier'))].sort((a, b) => a.localeCompare(b, 'fr'));

// ------------------------------------------------------------------ rendu / navigation
const PAGES = [['#/', '📊', 'Tableau de bord'], ['#/recettes', '📖', 'Recettes'], ['#/carte', '🍽️', 'Carte'], ['#/ingredients', '🥕', 'Ingrédients'], ['#/alertes', '🔔', 'Alertes'], ['#/reglages', '⚙️', 'Réglages']];
function rendre() {
  const root = $('#root');
  if (!TOKEN) { root.innerHTML = pageLogin(); $('#code').focus(); return; }
  if (!D) { const c = localStorage.getItem('rclv_cache'); if (c) { try { D = JSON.parse(c); recalculer(); } catch (e) {} } }
  if (!D) { root.innerHTML = '<div class="vide" style="margin-top:30vh">Chargement…</div>'; charger().then(rendre).catch(e => toast(e.message)); return; }
  const h = location.hash || '#/';
  const base = '#/' + (h.split('/')[1] || '');
  const nav = '<nav><div class="titre"><img src="logo.png" alt="Recettes"></div>' + PAGES.map(([u, i, l]) => {
    const on = (u === base || (u === '#/recettes' && (base === '#/r' || base === '#/edit')) || (u === '#/ingredients' && base === '#/i'));
    const b = (u === '#/alertes' && D.nonLues) ? ` <span class="badge">${D.nonLues}</span>` : '';
    return `<a href="${u}" class="${on ? 'on' : ''}"><span class="ico">${i}</span><span>${l}</span>${b}</a>`;
  }).join('') + '</nav>';
  let html = '';
  try {
    const p = h.split('/');
    if (base === '#/') html = pageDashboard();
    else if (base === '#/recettes') html = pageRecettes();
    else if (base === '#/r') html = pageFiche(decodeURIComponent(p[2]));
    else if (base === '#/edit') html = pageEdition(decodeURIComponent(p[2] || 'nouvelle'), p[3], p[4] === 'v');
    else if (base === '#/carte') html = pageCarte();
    else if (base === '#/ingredients') html = pageIngredients();
    else if (base === '#/alertes') html = pageAlertes();
    else if (base === '#/reglages') html = pageReglages();
    else html = pageDashboard();
  } catch (e) { html = '<div class="carte rouge">Erreur : ' + esc(e.message) + '</div>'; console.error(e); }

// tri des tableaux : clic sur un titre de colonne (2e clic = ordre inverse). Les cases vides vont toujours à la fin.
function trier(liste, k, s, get) {
  return liste.slice().sort((a, b) => {
    const x = get(a, k), y = get(b, k);
    const vx = x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)), vy = y === null || y === undefined || y === '' || (typeof y === 'number' && isNaN(y));
    if (vx || vy) return vx && vy ? 0 : (vx ? 1 : -1);
    return (typeof x === 'string' ? x.localeCompare(y, 'fr', { sensitivity: 'base' }) : x - y) * s;
  });
}
function thTri(t, k, label, cls = '') {
  const e = ETAT.tri[t], on = e.k === k;
  return `<th class="${cls} tri ${on ? 'on' : ''}" onclick="trierPar('${t}','${k}')" title="Trier">${label}<span class="fl">${on ? (e.s > 0 ? ' ▲' : ' ▼') : ' ↕'}</span></th>`;
}
function trierPar(t, k) {
  const e = ETAT.tri[t];
  if (e.k === k) e.s = -e.s; else { e.k = k; e.s = (k === 'nom' || k === 'fournisseur' || k === 'dossier') ? 1 : -1; }
  ETAT.focus = false; rendre();
}

async function reporterPrixCarte() {

}

    const set = (id, h) => { const e = document.getElementById(id + k); if (e) e.innerHTML = h; };
    set('u', x ? esc(x.unite) : (l.nom ? '<span class="pill p-ko">inconnu</span>' : ''));
    set('p', x ? (x.pu === null ? '<span class="pill p-ko">sans prix</span>' : (x.unite === 'pièce' ? nf(x.pu, 1) + '/pc' : nf(x.pu * 1000) + '/' + (x.unite === 'ml' ? 'L' : 'kg'))) : '');
    set('rb', x ? P(x.rendBase) : ''); set('c', x && x.cout !== null ? nf(x.cout, 1) : '');
  });
  $('#resume').innerHTML = `<div>Coût total<b>${F(c.total)}</b></div><div>Par portion<b>${F(c.cp)}</b></div><div>Coût / g<b>${c.cg !== null ? nf(c.cg, 3) + ' F' : '–'}</b></div><div>Total ml / g<b>${nf(c.poids)}</b></div><div>ml / g par portion<b>${volPortion(b, c) ? nf(volPortion(b, c)) : '–'}</b></div>` +
    (Number(b.prixTTC) ? `<div>Food cost<b>${P(c.fc, 1)}</b></div>` : '') + `<div>Prix TTC conseillé<b>${F(c.conseil)}</b></div>` + (c.manquants.length ? `<div>⚠️ incomplet<b>${c.manquants.length}</b></div>` : '');
}
async function enregistrer() {
  lireChamps();
  const b = BROUILLON;
  if (!String(b.nom || '').trim()) return toast('Donnez un nom à la recette');
  if (b.lignes.some(l => !l.id && l.nom)) return toast('Un ingrédient n\'est pas reconnu : choisissez-le dans la liste');
  const r = Object.assign({}, b, { lignes: b.lignes.filter(l => l.id) });
  const source = r._source; delete r._source; const lienCarte = r._carte; delete r._carte;
  r.tailles = (r.tailles || []).filter(t => String(t.nom || '').trim() && (Number(t.volume) > 0 || Number(t.coef) > 0)).map(t => ({ nom: String(t.nom).trim(), volume: Number(t.volume) || null, coef: Number(t.volume) ? null : Number(t.coef), prixTTC: Number(t.prixTTC) || null }));
  r.tailleBase = String(r.tailleBase || '').trim() || null;
  const nomsT = [r.tailleBase || 'Normal', ...r.tailles.map(t => t.nom)];
  if (new Set(nomsT).size !== nomsT.length) return toast('Deux tailles portent le même nom');
  r.famille = String(r.famille || '').trim() || null; r.version = r.famille ? (String(r.version || '').trim() || null) : null;
  try {
    const res = await api('saveRecette', { recette: r });
    if (source && r.famille) { const s0 = REC(source); if (s0 && !s0.famille) { const s1 = Object.assign({}, s0, { famille: r.famille, version: 'V1' }); const r1 = await api('saveRecette', { recette: s1 }); D.recettes[D.recettes.findIndex(x => x.id === source)] = r1.recette; } }
    const k = D.recettes.findIndex(x => x.id === res.recette.id);
    if (k < 0) D.recettes.push(res.recette); else D.recettes[k] = res.recette;
    if (lienCarte) await lierCarte(lienCarte, res.recette.id);
    recalculer(); toast('Recette enregistrée'); location.hash = '#/r/' + res.recette.id;
  } catch (e) { toast(e.message, 4000); }
}

// ------------------------------------------------------------------ ingrédients
function pageIngredients() {
  const q = norm(ETAT.qi);
  const util = {}; for (const r of D.recettes) for (const l of r.lignes || []) if (l.t === 'i') util[l.id] = (util[l.id] || 0) + 1;
  let l = D.ingredients.filter(i => (!q || norm(i.nom + ' ' + (i.fournisseur || '') + ' ' + (i.categorie || '')).includes(q))
    && (!ETAT.fi || (ETAT.fi === 'facture' ? i.source === 'facture' : ETAT.fi === 'sans' ? prixUnite(i) === null : ETAT.fi === 'var' ? Math.abs(i.variation || 0) >= (D.seuil || 0.05) : ETAT.fi === 'util' ? util[i.id] : true)));
  if (ETAT.fo) l = l.filter(i => (i.fournisseur || '—') === ETAT.fo);
  const get = (i, k) => k === 'nom' ? i.nom : k === 'prix' ? prixAff(i) : k === 'achat' ? i.prix : k === 'rend' ? (i.rend || 1) : k === 'fournisseur' ? (i.fournisseur || '') :
    k === 'maj' ? (i.maj || '') : k === 'var' ? i.variation : k === 'util' ? (util[i.id] || 0) : k === 'desig' ? (i.designation || '') : null;
  l = trier(l, ETAT.tri.ing.k, ETAT.tri.ing.s, get);
  const fourn = [...new Set(D.ingredients.map(i => i.fournisseur || '—'))].sort((a, b) => a.localeCompare(b, 'fr'));
  const preps = D.recettes.filter(r => r.ingredient && (!q || norm(r.nom).includes(q)));
  const f = [['', 'Tous'], ['util', 'Utilisés dans une recette'], ['facture', 'Prix des factures'], ['var', 'Prix qui ont bougé'], ['sans', 'Sans prix']].map(([k, t]) => `<span class="chip ${ETAT.fi === k ? 'on' : ''}" onclick="ETAT.fi='${k}';rendre()">${t}</span>`).join('');
  return `<div class="entete"><h1>Ingrédients</h1><div class="actions"><button onclick="ouvrirIngredient(null)">+ Nouvel ingrédient</button></div></div>
  <div class="outils"><input id="cherche" placeholder="Rechercher (nom, fournisseur)…" value="${esc(ETAT.qi)}" oninput="ETAT.qi=this.value;ETAT.focus=true;rendre()">
  <select onchange="ETAT.fo=this.value;ETAT.focus=false;rendre()"><option value="">Tous les fournisseurs</option>${fourn.map(f => `<option ${ETAT.fo === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>
  <span class="petit">${l.length} ingrédient${l.length > 1 ? 's' : ''} · cliquez sur un titre de colonne pour trier</span></div><div class="chips">${f}</div>
  <div class="carte" style="padding:6px 10px;overflow-x:auto"><table><tr>${thTri('ing', 'nom', 'Nom dans les recettes <span class="petit">(modifiable)</span>')}${thTri('ing', 'desig', 'Nom chez le fournisseur', 'mc')}${thTri('ing', 'prix', 'Prix HT', 'n')}${thTri('ing', 'achat', 'Achat', 'n mc')}${thTri('ing', 'rend', 'Rend.', 'n mc')}${thTri('ing', 'fournisseur', 'Fournisseur', 'mc')}${thTri('ing', 'maj', 'Mis à jour', 'n mc')}${thTri('ing', 'var', 'Variation', 'n')}${thTri('ing', 'util', 'Recettes', 'n')}</tr>
  ${l.map(i => { const p = prixAff(i); return `<tr class="clic" onclick="ouvrirIngredient('${i.id}')"><td><input class="renom mc" value="${esc(i.nom)}" title="Renommer (Entrée pour valider)" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')this.blur()" onchange="renommer('${i.id}',this)"><span class="mo">${esc(i.nom)}</span>${i.ttc ? ' <span class="pill p-g">TTC</span>' : ''}</td><td class="mc petit desig" title="${esc((i.designations || []).join(' / '))}">${esc(i.designation || '')}${(i.designations || []).length > 1 ? ` <span class="pill p-g">+${i.designations.length - 1}</span>` : ''}</td><td class="n">${p === null ? '<span class="pill p-ko">sans prix</span>' : nf(p, i.unite === 'pièce' ? 1 : 0) + ' F/' + uniteLabel(i)}</td><td class="n petit mc">${i.prix !== null && i.prix !== undefined ? F(i.prix) + ' / ' + nf(i.cond) + ' ' + esc(i.unite) : ''}</td><td class="n mc">${i.rend && i.rend !== 1 ? P(i.rend) : ''}</td><td class="petit mc">${esc(i.fournisseur || '')}${i.source === 'facture' ? ' 🧾' : ''}</td><td class="n petit mc">${esc((i.maj || '').split('-').reverse().join('/'))}</td><td class="n">${varPill(i.variation)}</td><td class="n">${util[i.id] || ''}</td></tr>`; }).join('')}</table></div>
  ${preps.length && !ETAT.fi ? `<div class="groupe">Recettes maison utilisées comme ingrédient</div><div class="carte" style="padding:6px 10px"><table><tr><th>Préparation</th><th class="n">Coût HT / kg</th><th class="n">Utilisée dans</th></tr>${preps.map(r => `<tr class="clic" onclick="location.hash='#/r/${r.id}'"><td class="violet">${esc(r.nom)}</td><td class="n">${PREPA[r.id] !== undefined ? nf(PREPA[r.id] * 1000) + ' F/kg' : '–'}</td><td class="n">${recettesUtilisant(D.recettes, 'r', r.id).length || ''}</td></tr>`).join('')}</table></div>` : ''}`;
}
let LIGNE_CIBLE = null;
function ouvrirIngredient(id, nomNouveau, ligne) {
  LIGNE_CIBLE = ligne ?? null;
  const i = id ? ING(id) : { nom: nomNouveau || '', unite: 'g', cond: 1000, rend: null, prix: null };
  const util = id ? recettesUtilisant(D.recettes, 'i', id).map(REC) : [];
  const m = document.createElement('div'); m.className = 'modal'; m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div><h2>${id ? esc(i.nom) : 'Nouvel ingrédient'}</h2>
  ${i.source === 'facture' ? `<div class="carte" style="background:var(--verf);padding:8px 12px">🧾 Prix de la facture ${esc(i.facture || '')} (${esc(i.fournisseur || '')}). Il sera remplacé par la prochaine facture.${i.prec ? ` Avant : ${nf(i.unite === 'pièce' ? i.prec : i.prec * 1000)} F/${uniteLabel(i)} ${varPill(i.variation)}` : ''}</div>` : ''}
  ${(i.designations || []).length ? `<div class="petit" style="margin-bottom:8px">Sur les factures : ${i.designations.map(d => `<div style="font-family:Consolas,monospace">${esc(d)}</div>`).join('')}</div>` : ''}
  <div class="grille form" id="fi">
    <div style="grid-column:1/-1"><label>Nom</label><input data-f="nom" value="${esc(i.nom)}"></div>
    <div><label>Prix d'achat HT (XPF)</label><input data-f="prix" type="number" inputmode="decimal" value="${i.prix ?? ''}"></div>
    <div><label>pour (quantité achetée)</label><input data-f="cond" type="number" inputmode="decimal" value="${i.cond ?? ''}"></div>
    <div><label>Unité</label><select data-f="unite">${['g', 'ml', 'pièce'].map(u => `<option ${i.unite === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
    <div><label>Rendement (0,6 = 60 %)</label><input data-f="rend" type="number" step="0.05" inputmode="decimal" value="${i.rend ?? ''}" placeholder="100 %"></div>
    <div><label>Fournisseur</label><input data-f="fournisseur" value="${esc(i.fournisseur || '')}"></div>
    <div><label>Catégorie</label><input data-f="categorie" value="${esc(i.categorie || '')}"></div>
    <div style="grid-column:1/-1"><label>Note</label><input data-f="note" value="${esc(i.note || '')}"></div>
  </div><p class="petit" id="pu"></p>
  ${util.length ? `<p class="petit">Utilisé dans : ${util.map(r => `<a href="#/r/${r.id}" onclick="this.closest('.modal').remove()">${esc(r.nom)}</a>`).join(', ')}</p>` : ''}
  <div class="actions" style="margin-top:12px"><button onclick="sauverIngredient('${id || ''}')">Enregistrer</button><button class="sec" onclick="this.closest('.modal').remove();if(LIGNE_CIBLE!==null)dessinerLignes()">Annuler</button>${id && !util.length ? `<button class="dang" onclick="supprimerIngredient('${id}')">Supprimer</button>` : ''}</div></div>`;
  document.body.appendChild(m);
  const maj = () => { const v = lireIng(); const pu = prixUnite(v); $('#pu').textContent = pu === null ? '' : '= ' + (v.unite === 'pièce' ? nf(pu, 2) + ' F la pièce' : nf(pu, 4) + ' F/' + v.unite + ' · ' + nf(pu * 1000) + ' F/' + (v.unite === 'ml' ? 'L' : 'kg')); };
  m.querySelectorAll('[data-f]').forEach(e => e.addEventListener('input', maj)); maj();
}
function lireIng() { const o = {}; document.querySelectorAll('#fi [data-f]').forEach(e => o[e.dataset.f] = e.value); for (const k of ['prix', 'cond', 'rend']) o[k] = o[k] === '' ? null : Number(o[k]); return o; }
async function sauverIngredient(id) {
  const o = lireIng(); if (id) o.id = id;
  try {
    const r = await api('saveIngredient', { ingredient: o });
    const k = D.ingredients.findIndex(x => x.id === r.ingredient.id);
    if (k < 0) D.ingredients.push(r.ingredient); else D.ingredients[k] = Object.assign({}, D.ingredients[k], r.ingredient);
    recalculer(); document.querySelector('.modal').remove(); toast('Ingrédient enregistré');
    if (LIGNE_CIBLE !== null && BROUILLON) { const l = BROUILLON.lignes[LIGNE_CIBLE]; l.t = 'i'; l.id = r.ingredient.id; delete l.nom; dessinerLignes(); }
    else rendre();
  } catch (e) { toast(e.message, 4000); }
}
async function renommer(id, el) {
  const i = ING(id), nom = el.value.trim();
  if (!nom || nom === i.nom) { el.value = i.nom; return; }
  try {
    const r = await api('saveIngredient', { ingredient: Object.assign({}, i, { nom }) });
    Object.assign(i, r.ingredient, { nom }); recalculer(); toast('Renommé : ' + nom + ' (le lien avec les factures est gardé)');
  } catch (e) { el.value = i.nom; toast(e.message, 4000); }
}
async function supprimerIngredient(id) {
  if (!confirm('Supprimer cet ingrédient ?')) return;
  try { await api('supprimerIngredient', { id }); D.ingredients = D.ingredients.filter(x => x.id !== id); recalculer(); document.querySelector('.modal').remove(); rendre(); } catch (e) { toast(e.message, 4000); }
}

// ------------------------------------------------------------------ alertes
function pageAlertes() {
  const al = D.alertes.slice().reverse();
  return `<h1>Alertes prix</h1><p class="petit">Hausse ou baisse d'au moins ${P(D.seuil || 0.05)} par rapport à l'achat précédent du même produit chez le même fournisseur, avec l'effet sur les recettes (y compris à travers les sauces maison).</p>
  ${al.length ? al.map(a => `<div class="carte alerte ${a.variation < 0 ? 'baisse' : ''}"><div class="entete"><div><b style="font-size:16px">${esc(a.ingredient)}</b> ${varPill(a.variation)}<div class="petit">${F(a.ancien)} → <b>${F(a.nouveau)}</b> / ${esc(a.unite)} · ${esc(a.fournisseur || '')} · facture du ${esc((a.date || '').split('-').reverse().join('/'))}</div></div><div class="petit">signalé le ${esc(a.le)}</div></div>
  ${a.impact.length ? `<table style="margin-top:6px"><tr><th>Recette</th><th class="n">Coût / portion</th><th class="n">Food cost</th></tr>${a.impact.map(i => { const r = REC(i.id); const c = r && C[r.id]; return `<tr class="clic" onclick="location.hash='#/r/${i.id}'"><td>${esc(i.nom)}</td><td class="n">${F(i.avant)} → ${F(i.apres)}</td><td class="n">${c && Number(r.prixTTC) ? fcPill(c.fc, c.cible) : ''}</td></tr>`; }).join('')}</table>` : '<div class="petit">Aucune recette n\'utilise cet ingrédient.</div>'}</div>`).join('') : '<div class="vide">Aucune alerte pour l\'instant. Elles arrivent chaque lundi avec les factures de la semaine.</div>'}`;
}

// ------------------------------------------------------------------ réglages
function pageReglages() {
  const push = 'serviceWorker' in navigator && 'PushManager' in window;
  return `<h1>Réglages</h1>
  <div class="carte"><h2>Notifications</h2><p class="petit">Recevoir les hausses / baisses de prix sur ce téléphone ou cet ordinateur. Sur iPhone : ajoutez d'abord l'appli à l'écran d'accueil (Partager › Sur l'écran d'accueil), puis ouvrez-la depuis l'icône.</p>
  <div class="actions">${push ? '<button onclick="activerPush()">Activer les notifications</button><button class="sec" onclick="api(\'testNotif\').then(()=>toast(\'Envoyée\')).catch(e=>toast(e.message))">Tester</button>' : '<span class="petit">Ce navigateur ne gère pas les notifications.</span>'}</div></div>
  <div class="carte"><h2>Seuil d'alerte</h2><div class="outils"><input type="number" id="seuil" value="${Math.round((D.seuil || 0.05) * 100)}" style="max-width:100px"> % <button class="sec" onclick="api('reglages',{seuil:Number($('#seuil').value)/100}).then(()=>{D.seuil=Number($('#seuil').value)/100;toast('Enregistré')}).catch(e=>toast(e.message))">Enregistrer</button></div></div>
  <div class="carte"><h2>Code d'accès</h2><div class="grille form"><div><label>Code actuel</label><input id="c1" type="password" inputmode="numeric"></div><div><label>Nouveau code (4 à 8 chiffres)</label><input id="c2" type="password" inputmode="numeric"></div></div>
  <p><button class="sec" onclick="api('changerCode',{ancien:$('#c1').value,nouveau:$('#c2').value}).then(()=>{toast('Code changé : reconnectez-vous');TOKEN='';localStorage.removeItem('rclv_token');rendre()}).catch(e=>toast(e.message))">Changer le code</button></p></div>
  <div class="carte"><h2>Données</h2><div class="actions"><button class="sec" onclick="exporterCSV()">Exporter les recettes (Excel)</button><button class="sec" onclick="charger().then(()=>{rendre();toast('À jour')}).catch(e=>toast(e.message))">Recharger</button><button class="dang" onclick="api('deconnexion').finally(()=>{TOKEN='';localStorage.removeItem('rclv_token');D=null;rendre()})">Se déconnecter</button></div>
  <p class="petit">Les prix des factures arrivent chaque lundi depuis le PC (tâche « CLV Prix fournisseurs »). Version ${APP_VERSION}.</p></div>`;
}
function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '==='.slice((s.length + 3) % 4); const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function activerPush() {
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    if (await Notification.requestPermission() !== 'granted') return toast('Notifications refusées');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(window.VAPID_PUBLIC) });
    await api('abonner', { sub: sub.toJSON() }); toast('Notifications activées ✔');
  } catch (e) { toast('Impossible : ' + e.message, 4000); }
}
function exporterCSV() {
  const L = [['Recette', 'Dossier', 'Utilisable comme ingrédient', 'Portions', 'Coût total HT', 'Coût / portion', 'Coût / g HT', 'Prix TTC', 'Food cost', 'Cible', 'Prix TTC conseillé', 'Ingrédients manquants']];
  for (const r of D.recettes.slice().sort((a, b) => (a.dossier || '').localeCompare(b.dossier || '', 'fr') || a.nom.localeCompare(b.nom, 'fr'))) {
    const c = C[r.id]; L.push([r.nom, r.dossier || '', r.ingredient ? 'Oui' : '', c.portions, Math.round(c.total), Math.round(c.cp), c.cg !== null ? c.cg.toFixed(3).replace('.', ',') : '', r.prixTTC || '', c.fc !== null ? (c.fc * 100).toFixed(1).replace('.', ',') + ' %' : '', Math.round(c.cible * 100) + ' %', Math.round(c.conseil), c.manquants.join(', ')]);
  }
  const csv = '﻿' + L.map(l => l.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'Recettes CLV.csv'; a.click();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
rendre();
if (TOKEN) setTimeout(() => charger().then(rendre).catch(() => {}), 50);
</script>
